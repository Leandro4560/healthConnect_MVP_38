steps:

  # ====================================================================
  # 1. Construir y Subir la Imagen del BACKEND (CORREGIDO: Nombre del Repositorio)
  # ====================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/backend:$COMMIT_SHA' # <-- REPOSITORIO CORREGIDO
      - '--file=Dockerfile' 
      - '.' 
    dir: 'backend'
    
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/backend:$COMMIT_SHA' # <-- REPOSITORIO CORREGIDO

  # ====================================================================
  # 2. Construir y Subir la Imagen del FRONTEND (CORREGIDO: Nombre del Repositorio)
  # ====================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/frontend:$COMMIT_SHA' # <-- REPOSITORIO CORREGIDO
      - '--file=src/Dockerfile' 
      - '.'
    dir: 'frontend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/frontend:$COMMIT_SHA' # <-- REPOSITORIO CORREGIDO

  # ====================================================================
  # 3. Desplegar el BACKEND en Cloud Run
  # ====================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Backend'
    entrypoint: gcloud 
    args:
      - 'run'
      - 'deploy'
      - 'backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/backend:$COMMIT_SHA' # <-- REPOSITORIO CORREGIDO
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'DATABASE_URL=${_DATABASE_URL}'
      
  # ====================================================================
  # 4. Desplegar el FRONTEND en Cloud Run
  # ====================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/frontend:$COMMIT_SHA' # <-- REPOSITORIO CORREGIDO
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# ====================================================================
# Variables de Sustitución (Mantiene tu URL)
# ====================================================================
