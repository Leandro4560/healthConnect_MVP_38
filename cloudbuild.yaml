steps:

  # ====================================================================
  # 1. Construir y Subir la Imagen del BACKEND (CORREGIDO: Ruta del Dockerfile)
  # ====================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/myflask-app/backend:$COMMIT_SHA' # Usando Artifact Registry
      - '--file=Dockerfile'  # <--- CORRECCIÓN FINAL: El Dockerfile está en /backend/Dockerfile
      - '.' 
    dir: 'backend' # Contexto es /backend
    
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/myflask-app/backend:$COMMIT_SHA' # Push a Artifact Registry

  # ====================================================================
  # 2. Construir y Subir la Imagen del FRONTEND (CORREGIDO: Push URL)
  # ====================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/myflask-app/frontend:$COMMIT_SHA' # Usa Artifact Registry
      - '--file=src/Dockerfile' 
      - '.'
    dir: 'frontend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/myflask-app/frontend:$COMMIT_SHA' # Push a Artifact Registry

  # ====================================================================
  # 3. Desplegar el BACKEND en Cloud Run (MANTIENE URL EXPUESTA)
  # ====================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Backend'
    entrypoint: gcloud 
    args:
      - 'run'
      - 'deploy'
      - 'backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/myflask-app/backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'DATABASE_URL=${_DATABASE_URL}' # Usa tu variable de sustitución
      
  # ====================================================================
  # 4. Desplegar el FRONTEND en Cloud Run
  # ====================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/myflask-app/frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'


