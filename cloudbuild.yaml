steps:
  # ====================================================================
  # 1. Construir y Subir la Imagen del BACKEND
  #    - Usa el Dockerfile ubicado en 'backend/scripts/'
  # ====================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/backend:$COMMIT_SHA'
      - 'backend/scripts' # Directorio donde se encuentra el Dockerfile del Backend
    dir: '.'
  
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend'
    args: ['push', 'gcr.io/$PROJECT_ID/backend:$COMMIT_SHA']
    dir: '.'

  # ====================================================================
  # 2. Construir y Subir la Imagen del FRONTEND
  #    - Usa el Dockerfile ubicado en 'frontend/src/'
  # ====================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA'
      - 'frontend/src' # Directorio donde se encuentra el Dockerfile del Frontend
    dir: '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend'
    args: ['push', 'gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA']
    dir: '.'

  # ====================================================================
  # 3. Desplegar el BACKEND en Cloud Run (usando la variable de entorno)
  # ====================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'DATABASE_URL=${_DATABASE_URL}' # Utiliza la variable de sustitución que definirás

  # ====================================================================
  # 4. Desplegar el FRONTEND en Cloud Run
  # ====================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# ====================================================================
# Imágenes para la limpieza de GCR
# ====================================================================
images:
  - 'gcr.io/$PROJECT_ID/backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA'

# ====================================================================
# Variables de Sustitución (Necesarias para la URL de la DB)
# ====================================================================
substitutions:
    # Debes definir el valor de esta variable en la configuración del activador
    # de Cloud Build para tu URL de base de datos real.
    _DATABASE_URL: postgresql://postgres.owmxsumofvrlnjbtrsir:fjIWOnVXmZOtjfpq@aws-1-us-east-2.pooler.supabase.com:6543/postgres
