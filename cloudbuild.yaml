steps:

  # ====================================================================
  # 1. Construir y Subir la Imagen del BACKEND (Python/FastAPI)
  # ====================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/backend:$COMMIT_SHA' # Repositorio corregido
      - '--file=Dockerfile'
      - '.'
    dir: 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/backend:$COMMIT_SHA'

  # ====================================================================
  # 2. CONSTRUIR EL CÓDIGO FUENTE DEL FRONTEND (Crea la carpeta 'dist')
  # Esto resuelve el error "COPY failed: file not found... stat dist: file does not exist"
  # ====================================================================
  - name: 'node:20' 
    id: 'Install Frontend Dependencies'
    entrypoint: 'npm'
    args: ['install']
    dir: 'frontend'

  - name: 'node:20'
    id: 'Run Frontend Build'
    entrypoint: 'npm'
    args: ['run', 'build'] 
    dir: 'frontend'
    
  # ====================================================================
  # 3. Construir y Subir la Imagen del FRONTEND (Ahora 'dist' ya existe)
  # ====================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend Image'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/frontend:$COMMIT_SHA'
      - '--file=Dockerfile'  # Ruta del Dockerfile en el contexto 'frontend'
      - '.'
    dir: 'frontend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/frontend:$COMMIT_SHA'

  # ====================================================================
  # 4. Desplegar el BACKEND en Cloud Run
  # ====================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'DATABASE_URL=${_DATABASE_URL}'

  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-flask-repo/frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# ====================================================================
# Variables de Sustitución y Opciones
# ====================================================================
